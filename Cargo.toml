[package]
name = "lazypackage"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[workspace]
resolver = "2"
members = ["crates/backends", "crates/core", "crates/tui"]

[workspace.package]
version = "0.1.0"
authors = ["Chicken_Yi"]
edition = "2021"
license = "MIT"

[dependencies]
lazypackage-backends = { path = "crates/backends" }
lazypackage-core = { path = "crates/core" }
lazypackage-tui = { path = "crates/tui" }
tokio = { version = "1", features = ["full"] }
crossterm = { version = "0.28" }
